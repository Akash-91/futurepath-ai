services:
  db:
    image: postgres:17
    container_name: futurepath-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-futurepath}
      POSTGRES_USER: ${POSTGRES_USER:-futurepath}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - futurepath_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-futurepath} -d ${POSTGRES_DB:-futurepath}"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  futurepath_db_data:
